# HTTPS gateway overlay. Requires a trusted IP certificate first.
services:
  db:
    ports: !reset []
    restart: unless-stopped
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      APP_ENV: staging
      ENABLE_FAULTS: 'false'
  frontend:
    ports: !reset []
    restart: unless-stopped
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP to the server public IPv4}
    ports: ['80:80', '443:443']
    volumes:
      - ./infra/Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - ./infra/private/letsencrypt:/etc/letsencrypt:ro
      - ./infra/private/acme-webroot:/srv/acme:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
volumes:
  caddy_data:
  caddy_config:
