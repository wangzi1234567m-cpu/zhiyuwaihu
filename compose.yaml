name: zhiyu
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: zhiyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: zhiyu
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyu -d zhiyu"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://zhiyu:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/zhiyu
      APP_ENV: development
      COOKIE_SECRET: ${COOKIE_SECRET:-local-development-secret-change-before-exposure}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-local-only}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ENABLE_FAULTS: ${ENABLE_FAULTS:-false}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
