services:
  backend:
    volumes: ["./backend:/app"]
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"]
  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
      - web_next:/app/.next
    command: ["node", "node_modules/next/dist/bin/next", "dev", "--hostname", "0.0.0.0"]
volumes:
  web_modules:
  web_next:
