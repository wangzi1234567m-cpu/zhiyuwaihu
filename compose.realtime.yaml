# Optional realtime dependencies/settings; create_app wires the default business adapter.
services:
  backend:
    build:
      args:
        INSTALL_REALTIME: 'true'
    environment:
      REALTIME_WEBRTC_ENABLED: ${REALTIME_WEBRTC_ENABLED:-false}
      REALTIME_APPLICATION_IDS: ${REALTIME_APPLICATION_IDS:-}
      REALTIME_STUN_URLS: ${REALTIME_STUN_URLS:-[]}
      REALTIME_TURN_URLS: ${REALTIME_TURN_URLS:-}
      REALTIME_TURN_SECRET: ${REALTIME_TURN_SECRET:-}
      MAX_DAILY_NATIVE_SESSIONS: ${MAX_DAILY_NATIVE_SESSIONS:-2}
      MAX_DAILY_NATIVE_TURNS: ${MAX_DAILY_NATIVE_TURNS:-8}
      REALTIME_VAD_MODE: ${REALTIME_VAD_MODE:-server_vad}
      REALTIME_VAD_SILENCE_MS: ${REALTIME_VAD_SILENCE_MS:-400}
      REALTIME_VAD_THRESHOLD: ${REALTIME_VAD_THRESHOLD:-0.5}
      REALTIME_SPEECH_BACKEND: ${REALTIME_SPEECH_BACKEND:-qwen_http}
      REALTIME_TTS_DRAIN_ENABLED: ${REALTIME_TTS_DRAIN_ENABLED:-false}
      REALTIME_DIAGNOSTICS_ENABLED: ${REALTIME_DIAGNOSTICS_ENABLED:-false}
